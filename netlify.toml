[build]
  command = "bun run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API routes are handled by netlify/functions/api.ts.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Client-side routing (React Router): serve index.html for every other
# path so deep links and page refreshes don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
